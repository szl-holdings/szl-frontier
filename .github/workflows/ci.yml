name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      - name: Verify Python frontier control plane
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          python3 --version
          python3 -m compileall -q python/szl_frontier
          python3 -m unittest discover -s python/tests -v

      - name: Prove JS/Python frontier policy parity
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          python3 -m szl_frontier list --min-score 70 > /tmp/python-frontier-catalog.json
          test -s /tmp/python-frontier-catalog.json

      - name: Verify frontier release intelligence controls
        run: node --test scripts/frontier-release-watch.test.mjs
      - name: Generate deterministic frontier manifest
        run: node scripts/generate-frontier-release-manifest.mjs
      - name: Verify generated frontier manifest
        run: node scripts/generate-frontier-release-manifest.mjs --check
