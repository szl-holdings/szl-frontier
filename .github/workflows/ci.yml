name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Receipt contract guards verify predecessor files at pinned commits.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck

      # The src/**/*.test.ts suites (including the Grok timeout/retry/receipt
      # ceilings and the model-registry pin) were only reachable via `npm test`
      # locally; run exactly the files listed in package.json's "test:ts"
      # script so CI cannot skip them.
      - name: Verify TypeScript unit tests (node --test, strip-types)
        run: npm run test:ts

      # Never regenerate first: that hid the seven-record checked-in projection
      # while the canonical source already contained the ten-record intake.
      - name: Verify committed frontier manifest without rewriting it
        run: node scripts/generate-frontier-release-manifest.mjs --check

      - name: Verify Python frontier control plane against committed source
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          python3 --version
          python3 -m compileall -q python/szl_frontier
          python3 -m unittest discover -s python/tests -v

      - name: Verify all frontier controls, wave pins, and actual JS/Python parity
        run: node --test scripts/frontier-*.test.mjs

      - name: Verify browser baseline and isolated PWA head contracts
        run: node --test scripts/browser-smoke-verdict.test.mjs scripts/grok-pwa-plugin.test.mjs

      - name: Verify outside-seat evidence and nightly chain controls
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Require unchanged tracked source after qualification
        run: git diff --exit-code

  # Both Hugging Face cards (the Space card README.md and the covenant dataset
  # card hf/dataset/README.md) against the org card contract: szl-holdings/.github
  # hf-card/schema.json front matter and the D10 claim rule (no MEASURED label or
  # benchmark-style number without a commit-pinned receipt link). The toolkit is
  # the same reviewed .github commit whose publisher lock hf-sync.yml installs.
  hf-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SZL_DOT_GITHUB_SHA: cdc158abf7f6aaef265698bcf27b1ddea693eb13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the pinned hf-card toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/.github
          ref: ${{ env.SZL_DOT_GITHUB_SHA }}
          path: .hf-card-toolkit
          sparse-checkout: hf-card
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install the hash-locked hf-card closure
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r .hf-card-toolkit/hf-card/requirements.txt
      - name: Lint the Space and dataset cards
        run: |
          set -euo pipefail
          test "$(git -C .hf-card-toolkit rev-parse HEAD)" = "$SZL_DOT_GITHUB_SHA"
          python .hf-card-toolkit/hf-card/lint.py README.md --type space
          python .hf-card-toolkit/hf-card/lint.py hf/dataset/README.md --type dataset
