name: Frontier proof witness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install exact dependency closure
        run: npm ci
      - name: Verify committed release manifest before any build
        run: node scripts/generate-frontier-release-manifest.mjs --check
      - name: Verify every release, wave, pin and projection control
        run: node --test scripts/frontier-*.test.mjs
      - name: Typecheck exact source
        run: npm run typecheck
      - name: Build exact source
        run: npm run build
      - name: Require build to preserve the committed release projection
        run: |
          node scripts/generate-frontier-release-manifest.mjs --check
          git diff --exit-code -- public/frontier/release-evaluation-manifest.v1.json
      - name: Emit proof-carrying release witness
        shell: bash
        run: |
          set -euo pipefail
          node scripts/frontier-proof.mjs | tee frontier-proof.json
          {
            echo '## Frontier proof witness'
            echo
            echo "Source: \`${GITHUB_SHA}\`"
            echo
            echo '```json'
            cat frontier-proof.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
