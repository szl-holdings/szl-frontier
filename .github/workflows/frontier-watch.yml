name: Hugging Face frontier watch

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "Open deduplicated GitHub issues for material candidates"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: hugging-face-frontier-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'szl-holdings/szl-frontier'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Verify deterministic admitted-release manifest
        run: node scripts/generate-frontier-release-manifest.mjs --check

      - name: Verify materiality and deduplication controls
        run: >-
          node --test
          scripts/frontier-release-watch.test.mjs
          scripts/open-frontier-alerts.test.mjs

      - name: Verify Python frontier control plane
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          python3 -m compileall -q python/szl_frontier
          python3 -m unittest discover -s python/tests -v
          python3 -m szl_frontier list --min-score 70 > python-frontier-catalog.json

      - name: Scan primary Hugging Face sources
        id: scan
        continue-on-error: true
        run: node scripts/frontier-release-watch.mjs --live --output frontier-watch-output.json

      - name: Scan Python-curated Hugging Face admissions
        id: python_scan
        continue-on-error: true
        env:
          PYTHONPATH: python
        run: >-
          python3 -m szl_frontier watch
          --origin python-admission
          --output python-frontier-watch-output.json
          --require-complete

      - name: Combine JavaScript and Python witness evidence
        id: combine
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          jq -s '
            {
              schema: "szl.frontier.combined-watch-output.v1",
              live: (all(.[]; .live == true)),
              catalogEvaluatedAt: ([.[].catalogEvaluatedAt] | map(select(. != null)) | max),
              evaluatedThrough: ([.[].evaluatedThrough] | map(select(. != null)) | max),
              sourceCount: (map(.sourceCount // 0) | add),
              successfulSources: (map(.successfulSources // 0) | add),
              sourceResults: (map(.sourceResults // []) | add),
              errors: (map(.errors // []) | add),
              materialCandidates: (map(.materialCandidates // []) | add),
              productionPromotion: (any(.[]; .productionPromotion == true))
            }
          ' frontier-watch-output.json python-frontier-watch-output.json \
            > combined-frontier-watch-output.json

      - name: Publish evidence summary
        if: steps.combine.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Hugging Face frontier watch'
            echo
            echo "Evaluated through: \`$(jq -r .evaluatedThrough combined-frontier-watch-output.json)\`"
            echo
            echo "Combined primary sources: **$(jq -r .successfulSources combined-frontier-watch-output.json)/$(jq -r .sourceCount combined-frontier-watch-output.json)**"
            echo
            echo "Combined material candidates: **$(jq -r '.materialCandidates | length' combined-frontier-watch-output.json)**"
            echo
            echo "Production promotion: **$(jq -r .productionPromotion combined-frontier-watch-output.json)**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve machine-readable watch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontier-watch-${{ github.run_id }}
          path: |
            frontier-watch-output.json
            python-frontier-watch-output.json
            combined-frontier-watch-output.json
            python-frontier-catalog.json
          if-no-files-found: error
          retention-days: 30

      - name: Notify only for new material candidates
        if: steps.combine.outcome == 'success' && (github.event_name == 'schedule' || inputs.notify == true)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/open-frontier-alerts.mjs combined-frontier-watch-output.json

      - name: Enforce complete primary-source coverage
        if: always()
        env:
          FRONTIER_SCAN_OUTCOME: ${{ steps.scan.outcome }}
          PYTHON_FRONTIER_SCAN_OUTCOME: ${{ steps.python_scan.outcome }}
          COMBINED_FRONTIER_OUTCOME: ${{ steps.combine.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FRONTIER_SCAN_OUTCOME" != "success" ]]; then
            echo '::error::JavaScript frontier scan did not achieve complete primary-source coverage.'
            exit 1
          fi
          if [[ "$PYTHON_FRONTIER_SCAN_OUTCOME" != "success" ]]; then
            echo '::error::Python curated frontier scan did not achieve complete primary-source coverage.'
            exit 1
          fi
          if [[ "$COMBINED_FRONTIER_OUTCOME" != "success" ]]; then
            echo '::error::Combined frontier evidence was not produced.'
            exit 1
          fi
          jq -e '
            (.successfulSources == .sourceCount)
            and ((.errors | length) == 0)
            and (.productionPromotion == false)
          ' combined-frontier-watch-output.json > /dev/null
