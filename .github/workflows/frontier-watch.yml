name: Hugging Face frontier watch

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "Open deduplicated GitHub issues for material candidates"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: hugging-face-frontier-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'szl-holdings/szl-frontier'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Verify deterministic admitted-release manifest
        run: node scripts/generate-frontier-release-manifest.mjs --check

      - name: Verify materiality and deduplication controls
        run: >-
          node --test
          scripts/frontier-release-watch.test.mjs
          scripts/open-frontier-alerts.test.mjs

      - name: Scan primary Hugging Face sources
        run: node scripts/frontier-release-watch.mjs --live --output frontier-watch-output.json

      - name: Publish evidence summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Hugging Face frontier watch'
            echo
            echo "Evaluated through: \`$(jq -r .evaluatedThrough frontier-watch-output.json)\`"
            echo
            echo "Successful primary sources: **$(jq -r .successfulSources frontier-watch-output.json)/$(jq -r .sourceCount frontier-watch-output.json)**"
            echo
            echo "Material candidates: **$(jq -r '.materialCandidates | length' frontier-watch-output.json)**"
            echo
            echo 'Production promotion: **false**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve machine-readable watch evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontier-watch-${{ github.run_id }}
          path: frontier-watch-output.json
          if-no-files-found: error
          retention-days: 30

      - name: Notify only for new material candidates
        if: github.event_name == 'schedule' || inputs.notify == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/open-frontier-alerts.mjs frontier-watch-output.json
