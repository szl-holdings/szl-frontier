version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      github_actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # better-auth is held on 1.6.x. In 1.7 the genericOAuth plugin no longer
      # has its own endpoints: genericOAuthClient and auth.api.signInWithOAuth2
      # are gone, and providers sign in through /sign-in/social and call back on
      # /api/auth/callback/<id> instead of /api/auth/oauth2/callback/<id>. The
      # auth broker's preview client accepts only the oauth2 callback path (see
      # src/lib/auth/preview.ts), so 1.7 fails typecheck and would change the
      # auth flow (see PR #251). The @better-auth/* packages are pinned exactly by
      # better-auth, so they stay on 1.6.x with it. Remove this entry once the
      # auth code is migrated to the 1.7 social-provider flow.
      - dependency-name: "better-auth"
        versions: [">=1.7"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns:
          - "*"
