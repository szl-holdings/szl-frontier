[build-system]
requires = ["setuptools>=77"] # PEP 639 license expression and license-files
build-backend = "setuptools.build_meta"

[project]
name = "szl-frontier-control-plane"
version = "0.5.0"
description = "Evidence-first Hugging Face frontier release intelligence for SZL Holdings"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SZL Holdings" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
# The Python suites use only the standard library (unittest). The extra exists
# so the documented `pip install -e '.[test]'` resolves instead of warning.
test = []

[project.scripts]
szl-frontier = "szl_frontier.cli:main"

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-frontier"
Source = "https://github.com/szl-holdings/szl-frontier"
Issues = "https://github.com/szl-holdings/szl-frontier/issues"
Changelog = "https://github.com/szl-holdings/szl-frontier/releases"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
exclude = ["tests*", "payload*", "wave5*"]

[tool.szl.release]
import_names = ["szl_frontier"] # wheel top-level import names; the release gate fails if the built wheel differs
