[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-frontier-control-plane"
version = "0.5.0"
description = "Evidence-first Hugging Face frontier release intelligence for SZL Holdings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SZL Holdings" }]
dependencies = []

[project.scripts]
szl-frontier = "szl_frontier.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
